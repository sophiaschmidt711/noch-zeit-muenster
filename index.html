function renderDepartures(){const box=$("#departures"),filter=state.lineFilter.trim().toLocaleLowerCase(),items=state.departures.filter(d=>!filter||String(d.linientext||"").toLocaleLowerCase()===filter);if(!items.length){box.innerHTML='<div class="message">'+(filter?"Für diese Linie ist gerade keine Abfahrt gemeldet.":"In den nächsten zwei Stunden ist keine Abfahrt gemeldet.")+"</div>";return}box.innerHTML=items.map(d=>{const delay=Math.round(Number(d.delay||0)/60);return '<button class="departure" data-trip="'+e(d.fahrtbezeichner)+'"><span class="line" style="background:'+color(d.linientext)+'">'+e(d.linientext)+'</span><span><span class="destination">'+e(d.richtungstext||"Richtung unbekannt")+'</span><span class="meta '+(delay>0?"delay":"")+'">'+(delay>0?"+"+delay+" Min. später":delay<0?Math.abs(delay)+" Min. früher":"pünktlich")+'</span></span><span class="time"><span class="minutes">'+mins(when(d))+' min</span><span class="clock">'+time(when(d))+'</span></span></button>'}).join("");box.querySelectorAll("[data-trip]").forEach(b=>b.onclick=()=>showTrip(state.departures.find(d=>d.fahrtbezeichner===b.dataset.trip)))}
function renderVehicles(){if(!markers)return;markers.clearLayers();const bounds=[];state.vehicles.filter(f=>!state.line||String(f.properties?.linientext)===String(state.line)).forEach(f=>{const c=f.geometry?.coordinates,p=f.properties||{};if(!c)return;const point=[c[1],c[0]],selected=state.trip===p.fahrtbezeichner,icon=L.divIcon({className:"",html:'<div class="bus '+(selected?"selected":"")+'" style="background:'+color(p.linientext)+'">'+e(p.linientext||"Bus")+'</div>',iconSize:[34,30],iconAnchor:[17,15]}),m=L.marker(point,{icon}).addTo(markers);m.bindTooltip("Linie "+e(p.linientext||"")+" · "+e(p.richtungstext||""),{direction:"top",offset:[0,-12]});m.on("click",()=>showTrip({fahrtbezeichner:p.fahrtbezeichner,fahrzeugid:p.fahrzeugid,linientext:p.linientext,richtungstext:p.richtungstext}));bounds.push(point)});if(!state.line&&bounds.length)map.fitBounds(bounds,{padding:[15,15],maxZoom:13});if(!state.line)$("#note").textContent=state.vehicles.length+" Busse live · Bus oder Haltestelle antippen."}
const showSelectedTrip=showTrip;showTrip=async item=>{state.line=item?.linientext||null;return showSelectedTrip(item)};const drawSelectedTrip=draw;draw=(item,trip)=>{drawSelectedTrip(item,trip);directionMarker?.remove();const cs=trip.geometry?.coordinates||[],v=vehicle(item)?.geometry?.coordinates;if(cs.length<2)return;let n=0;if(v){let best=Infinity;cs.forEach((c,i)=>{const d=(c[0]-v[0])**2+(c[1]-v[1])**2;if(d<best){best=d;n=i}})}const a=cs[n],b=cs[Math.min(n+10,cs.length-1)],angle=Math.atan2(-(b[1]-a[1]),b[0]-a[0])*180/Math.PI;directionMarker=L.marker([b[1],b[0]],{icon:L.divIcon({className:"",html:'<div style="display:grid;place-items:center;width:29px;height:29px;border:3px solid white;border-radius:50%;color:white;background:'+color(item.linientext)+';box-shadow:0 3px 10px #17131f40;font-size:17px;font-weight:900;transform:rotate('+angle+'deg)">➜</div>',iconSize:[29,29],iconAnchor:[14,14]})}).addTo(map)}
function reset(){state.trip=null;state.line=null;routeLayer?.remove();routeLayer=null;directionMarker?.remove();directionMarker=null;$("#reset").hidden=true;$("#mapTitle").textContent="Busse in Münster";$("#mapSubtitle").textContent="Bus oder Haltestelle antippen";$("#route").hidden=true;renderVehicles()}
$("#lineFilter").oninput=e=>{state.lineFilter=e.target.value;renderDepartures()};$("#reset").onclick=reset;
function showNearbyStops(){if(!navigator.geolocation){$("#nearbyList").hidden=false;$("#nearbyList").textContent="Standort wird von diesem Browser nicht unterstützt.";return}const button=$("#nearbyStops"),box=$("#nearbyList");button.disabled=true;button.textContent="Standort wird gesucht …";navigator.geolocation.getCurrentPosition(p=>{const here=[p.coords.longitude,p.coords.latitude],nearby=state.stops.map(g=>({...g,distance:Math.min(...g.coordinates.map(c=>km(here,c)))})).filter(g=>Number.isFinite(g.distance)).sort((a,b)=>a.distance-b.distance).slice(0,6);box.innerHTML=nearby.map(g=>'<button class="nearby-chip" data-stop="'+e(g.name)+'">'+e(name(g.name))+'<small>'+(g.distance<1?Math.round(g.distance*1000)+" m":g.distance.toFixed(1)+" km")+'</small></button>').join("");box.hidden=false;box.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>select(b.dataset.stop));map.setView([p.coords.latitude,p.coords.longitude],15);button.disabled=false;button.textContent="◎ Haltestellen in meiner Nähe"},()=>{box.hidden=false;box.textContent="Standort nicht freigegeben.";button.disabled=false;button.textContent="◎ Haltestellen in meiner Nähe"},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}$("#nearbyStops").onclick=showNearbyStops;
</script></body></html>
